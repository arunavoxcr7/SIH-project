<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100">
  <defs>
    <linearGradient id="oilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="oilNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#051626" />
    </linearGradient>
    <linearGradient id="flameRed" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield / Circle -->
    <ellipse cx="42" cy="45" rx="38" ry="40" fill="url(#oilNavy)" stroke="url(#oilGold)" stroke-width="3.5" filter="url(#shadow)"/>
    
    <!-- Inner Ring -->
    <ellipse cx="42" cy="45" rx="33" ry="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Oil Derrick / Flame Symbol -->
    <g transform="translate(42, 45) scale(0.85)">
      <!-- Derrick Legs -->
      <path d="M-18 25 L-8 -15 L8 -15 L18 25 M-14 10 L14 10 M-10 -2 L10 -2 M-6 -10 L6 -10" stroke="url(#oilGold)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Cross Bracing -->
      <line x1="-12" y1="10" x2="6" y2="-2" stroke="url(#oilGold)" stroke-width="1.8" opacity="0.8"/>
      <line x1="12" y1="10" x2="-6" y2="-2" stroke="url(#oilGold)" stroke-width="1.8" opacity="0.8"/>
      <line x1="-16" y1="25" x2="10" y2="10" stroke="url(#oilGold)" stroke-width="1.8" opacity="0.8"/>
      <line x1="16" y1="25" x2="-10" y2="10" stroke="url(#oilGold)" stroke-width="1.8" opacity="0.8"/>
      
      <!-- Energy Flame Top -->
      <path d="M0 -34 C-6 -22, -9 -14, 0 -8 C9 -14, 6 -22, 0 -34 Z" fill="url(#flameRed)"/>
      <path d="M0 -28 C-3 -20, -4 -15, 0 -11 C4 -15, 3 -20, 0 -28 Z" fill="#FFD700"/>
    </g>
    
    <!-- Decorative Stars/Dots -->
    <circle cx="16" cy="45" r="2" fill="#FFD700"/>
    <circle cx="68" cy="45" r="2" fill="#FFD700"/>
  </g>
  
  <!-- Text Branding -->
  <g transform="translate(100, 20)">
    <!-- English Name -->
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#0A192F" letter-spacing="0.5">OIL INDIA LIMITED</text>
    
    <!-- Hindi Subtitle -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="0.8">ऑयल इंडिया लिमिटेड • Navratna PSU Enterprise</text>
    
    <!-- Sub Brand Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="4" width="220" height="18" rx="3" fill="#0F2B48"/>
      <text x="8" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#FFD700" letter-spacing="1">INTELLIGENT PROGRESS BRIDGE</text>
    </g>
  </g>
</svg>
